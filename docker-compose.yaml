x-backend: &backend
  build: .
  volumes:
    - ./data:/data
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=1).close()"]
    interval: 2s
    timeout: 2s
    retries: 10

services:
  backend-1:
    <<: *backend
    env_file: ./env/backend-1/.env

  backend-2:
    <<: *backend
    env_file: ./env/backend-2/.env

  loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy